<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do list</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div class="contenir">
        <h1 class="title">To Do list</h1>
        <form class="form">
            <input placeholder="Напрмер: убратса в комноте" type="text" name="" id="" class="todo">
            <button type="submit" class="add">Add</button>
        </form>
        <div class="board">
            <div class="box">
                <strong>Todo</strong>
                <div data-count="todo" class="columns">

                </div>
            </div>
            <div class="box">
                <strong>Doing</strong>
                <div data-count="doing" class="columns">

                </div>
            </div>
            <div class="box">
                <strong>Does</strong>
                <div data-count="done" class="columns">

                </div>
            </div>



        </div>
    </div>


<script src="app.js"></script>
</body>

</html>
